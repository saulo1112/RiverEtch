# The earlier years' images, 2019 to 2025 (docs/water-quality/preregistration-archive-maps.md):
# drawn once, by hand, after that preregistration's line is anchored (the pipeline refuses before).
# One job per reach and year draws the NDTI map and the true-colour image of every pass the year's
# file lists; the last job publishes them all to the `data` branch, the only place they live (never
# `main`, never the web build). It needs no secret: it never signs or anchors.
name: Earlier years' images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    name: Images ${{ matrix.site }} ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        site: [mississippi-belle-chasse, platte-louisville, mississippi-st-joseph, firat-birecik]
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          working-directory: pipeline

      - name: Install dependencies (locked)
        working-directory: pipeline
        run: uv sync --locked

      # The daily run's band and geometry reads, so the reach's frozen geometry is not read again.
      - name: Restore the daily run's cache
        uses: actions/cache/restore@v6
        with:
          path: pipeline/out/cache
          key: archive-maps-${{ github.run_id }}
          restore-keys: daily-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Draw the year
        working-directory: pipeline
        run: >-
          uv run climate-pipeline reach archive-maps --site ${{ matrix.site }}
          --year ${{ matrix.year }} --root ..

      - name: Upload the year
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-maps-${{ matrix.site }}-${{ matrix.year }}
          path: docs/water-quality/reach/${{ matrix.site }}/examples/archive-maps/
          if-no-files-found: warn

  publish:
    name: Publish to the data branch
    needs: draw
    # What was drawn is published even when a year stopped part way (the next run resumes it).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the data branch
        uses: actions/checkout@v7
        with:
          ref: data
          fetch-depth: 1
          path: data

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          pattern: archive-maps-*
          path: drawn

      # The daily run may push to `data` meanwhile: when the push is rejected, the images are laid
      # again over the newer branch and pushed (three tries). They touch no file the daily run
      # writes.
      - name: Publish
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            for folder in drawn/archive-maps-*; do
              [ -d "$folder" ] || continue
              name="${folder#drawn/archive-maps-}"
              site="${name%-*}"
              target="data/docs/water-quality/reach/$site/examples/archive-maps"
              mkdir -p "$target"
              rsync -a "$folder/" "$target/"
            done
            git -C data add -A docs
            if git -C data diff --cached --quiet; then
              echo "Nothing new to publish."
              return 0
            fi
            git -C data commit -q -m "data: the earlier years' images (preregistration-archive-maps.md)"
            git -C data push origin HEAD:data
          }
          for attempt in 1 2 3; do
            if publish; then
              exit 0
            fi
            echo "The data branch moved: publishing again over it (try $attempt)."
            git -C data fetch --no-tags --depth=1 origin data
            git -C data reset -q --hard FETCH_HEAD
          done
          exit 1
