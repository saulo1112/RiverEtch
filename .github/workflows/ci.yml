name: CI

# Pull requests cover feature branches; pushes are only built on main, so a branch with an open PR
# does not burn Actions minutes twice per push. Use "Run workflow" for a branch without a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are for local commits only.
  HUSKY: "0"

jobs:
  contracts-web:
    name: Contracts & web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint Solidity (Solhint + NatSpec)
        run: npm run lint:sol

      - name: Compile contracts
        run: npm run compile

      # After compiling: typed lint rules need the generated TypeChain bindings.
      - name: Lint TypeScript (ESLint + TSDoc)
        run: npm run lint:ts

      - name: Type-check
        run: npm run typecheck

      - name: Contract tests (Solidity + TypeScript)
        run: npm test

      - name: Build frontend
        run: npm run build

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Same uv version that wrote uv.lock, so `--locked` cannot fail on a format change.
          version: "0.12.23"
          working-directory: pipeline

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff, including docstring rules)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest
