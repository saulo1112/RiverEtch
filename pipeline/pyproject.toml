[project]
name = "climate-pipeline"
version = "0.1.0"
description = "Sentinel-2 river turbidity anomaly detection and extreme-rainfall correlation for Colombian rivers."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "pydantic>=2.13,<3",
    "pystac-client>=0.9,<0.10",
    "pyyaml>=6.0,<7",
    "rasterio>=1.5,<2",
]

[project.scripts]
climate-pipeline = "climate_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pandas-stubs>=3.0,<3.1",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle: docstrings on public modules, classes and functions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior; docstrings there would be noise.
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# rasterio ships no type information; only climate_pipeline.screening.rio imports it and returns
# typed values.
[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
