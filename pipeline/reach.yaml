# Reach runs (P3 of the water-quality plan, D16): `climate-pipeline reach run` publishes observation
# records v2 for the scenes of a reach after its frozen baselines. The verdict follows the D0 rule on
# NDTI (pipeline/screening.yaml, unchanged); NIR/red is context; a physical value appears only where
# a model card's level says estimated or validated. Paths are relative to the repository root.

title: Reach runs
screening_config: pipeline/screening.yaml
quality_config: pipeline/water-quality.yaml
calibration_config: pipeline/calibration.yaml # D15: the station geometry and window guards
models: docs/water-quality/results/models # the product's model cards, one per target

threshold: 3.0 # D0
lookback_days: 30 # a run without --since starts this many days before today

reaches:
  - site: missouri-hermann # v4, section A: the second reach (preregistration)
    site_file: pipeline/reaches/missouri-hermann.yaml # outside the Colombian screening
    estimate_station: USGS-06934500 # the streamgage, at the upstream end
    station_source: usgs
    timezone: America/Chicago
    targets: [turbidity] # FNU; no TSS at Hermann
    cards:
      turbidity: docs/water-quality/results/models/missouri-hermann/turbidity.json
    rainy_months: [4, 5, 6, 7] # spring and early-summer high water (general hydrology, not sourced)
    geometry_start: 2022-01-01
    geometry_end: 2025-12-31
    baseline_start: 2019-01-01 # the reach measures its own NDTI baseline (no validation scenes)
    nir_red_baseline: docs/water-quality/reach/missouri-hermann/nir-red-baseline.csv
    baseline_end: 2025-12-31
    baseline_max_gb: 6.0 # v4, section A
  - site: mississippi-belle-chasse # v5: a demo reach (preregistration v5)
    site_file: pipeline/reaches/mississippi-belle-chasse.yaml
    estimate_station: USGS-07374525 # the streamgage, at the downstream end
    station_source: usgs
    timezone: America/Chicago
    targets: [turbidity] # FNU
    cards:
      turbidity: docs/water-quality/results/models/mississippi-belle-chasse/turbidity.json
    rainy_months: [5, 6, 7, 8, 9] # summer convection (general climatology, not sourced)
    geometry_start: 2022-01-01
    geometry_end: 2025-12-31
    baseline_start: 2019-01-01
    nir_red_baseline: docs/water-quality/reach/mississippi-belle-chasse/nir-red-baseline.csv
    baseline_end: 2025-12-31
    baseline_max_gb: 6.0 # v5
  - site: platte-louisville # v5: a demo reach (preregistration v5)
    site_file: pipeline/reaches/platte-louisville.yaml
    estimate_station: USGS-06805500 # the streamgage, at the upstream end
    station_source: usgs
    timezone: America/Chicago
    targets: [turbidity] # FNU
    cards:
      turbidity: docs/water-quality/results/models/platte-louisville/turbidity.json
    rainy_months: [4, 5, 6, 7] # spring and early-summer high water (general hydrology, not sourced)
    geometry_start: 2022-01-01
    geometry_end: 2025-12-31
    baseline_start: 2019-01-01
    nir_red_baseline: docs/water-quality/reach/platte-louisville/nir-red-baseline.csv
    baseline_end: 2025-12-31
    baseline_max_gb: 6.0 # v5
  - site: mississippi-st-joseph # the ungauged reach (preregistration-transfer.md, section 5)
    site_file: pipeline/reaches/mississippi-st-joseph.yaml
    estimate_station: window-st-joseph # no gauge: the window's own id
    station_source: ungauged # never checked or scored; a class only, from the transfer test
    estimate_point:
      lon: -91.250112
      lat: 31.871827
      basis:
        "USGS 315218091150000 (Mississippi R nr St. Joseph, LA; a listed location with no series).
        Chosen on 2026-10-20, before any estimate on the reach, because its main channel (522 m)
        is inside the widths the model was trained on (305 to 773 m); the Natchez gauge reads 848
        m and mile 378 reads 1028 m, where every scene would abstain."
      source_url: https://waterdata.usgs.gov/monitoring-location/USGS-315218091150000/
    # Its climate context only (never its own reading, never scored): the daily flow measured at
    # Vicksburg, on the same river upstream; Natchez and Tarbert Landing, downstream, publish no
    # daily discharge (USGS site service, 2026-10-21).
    climate_station:
      id: USGS-07289000
      name: Mississippi River at Vicksburg, MS
      basis:
        "Measured at Vicksburg, on the same river 59.0 km upstream of the reading spot in a straight
        line (great-circle distance), a station that publishes daily discharge; Natchez and Tarbert
        Landing, downstream, publish none. This reach has no station of its own."
    timezone: America/Chicago
    targets: [turbidity] # FNU class
    cards:
      # Four classes since preregistration-four-classes.md passed (frozen-artifacts line 19);
      # the three-class card (line 13) stays named by the records sealed with it.
      turbidity: docs/water-quality/ungauged/mississippi-st-joseph/turbidity-4.json
    rainy_months: [5, 6, 7, 8, 9] # summer convection (general climatology, not sourced)
    geometry_start: 2022-01-01
    geometry_end: 2025-12-31
    baseline_start: 2019-01-01
    nir_red_baseline: docs/water-quality/reach/mississippi-st-joseph/nir-red-baseline.csv
    baseline_end: 2025-12-31
    baseline_max_gb: 6.0 # as v5's reaches
  # The ungauged reach outside the tested region (preregistration-outside-us.md), added after its
  # anchor (frozen-artifacts, 17 lines, Sepolia block 11957144), as section 5 fixes it.
  - site: firat-birecik
    site_file: pipeline/reaches/firat-birecik.yaml
    estimate_station: window-birecik # no gauge: the window's own id
    station_source: ungauged # never checked or scored; a class only, with no error estimate
    estimate_point:
      lon: 37.97299
      lat: 37.02655
      basis:
        "The Birecik Bridge (OpenStreetMap way 13638374). Chosen by preregistration-outside-us.md,
        section 2, before any reading of the reach: its main channel (322.5 m) lies inside the
        widths the model was trained on (305 to 773 m) by the largest margin of the points
        measured."
      source_url: https://www.openstreetmap.org/way/13638374
    # Its climate context only (never its own reading, never scored): no open station record of
    # the river's daily flow was found, so the flow a flood model computes, named as modelled.
    # The cell: the largest modelled flow within 5 km of the reading spot (2019 to 2021: mean
    # 674 m³/s); the cells around it carry a few m³/s, side valleys of a 5 km grid. The API
    # documents values from 1984; at this cell they start on 1 January 1997 (earlier days empty).
    climate_model:
      lat: 37.025
      lon: 37.925
      name: "GloFAS flood model, cell 37.025° N, 37.925° E"
      basis: "Modelled, not measured: GloFAS v4 (Copernicus Emergency Management Service) through
        Open-Meteo, its reanalysis to July 2022 and its forecasts after (Open-Meteo's
        documentation). The cell is the one with the most modelled flow within 5 km of the
        reading spot, 4 km west of it."
      # Its 7-day low stays within about 1 % every year (402.7 to 406.4 m³/s, 1997 to 2025), so
      # the years are not ranked by it; decided after seeing the record.
      rank_lows: false
    timezone: Europe/Istanbul
    targets: [turbidity] # FNU class
    cards:
      # Four classes (preregistration-four-classes.md passed; frozen-artifacts line 20), from
      # its first record: the three-class card (line 17) names none.
      turbidity: docs/water-quality/ungauged/firat-birecik/turbidity-4.json
    rainy_months: [11, 12, 1, 2, 3, 4] # at least 30 mm a month (WMO normals 1991-2020, Birecik)
    geometry_start: 2022-01-01
    geometry_end: 2025-12-31
    baseline_start: 2019-01-01
    nir_red_baseline: docs/water-quality/reach/firat-birecik/nir-red-baseline.csv
    baseline_end: 2025-12-31
    baseline_max_gb: 6.0 # as the other reaches

budgets:
  max_gb: 2.0 # per run (a month of scenes is ~0.3 GB)
  keep_free_gb: 20
  baseline_max_gb: 4.0 # the one-off NIR/red baseline (2 GB preregistered; deviation 6)

out: pipeline/out/reach
