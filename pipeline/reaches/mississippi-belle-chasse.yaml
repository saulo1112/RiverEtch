# Mississippi River, Chalmette to Belle Chasse (Louisiana, USA): a v5 demo reach (preregistration v5).
# The estimate station is the continuous, approved turbidity gauge at the downstream end (USGS 07374525).
# It lives outside pipeline/sites/ so the Colombian site screening never reads it.
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: mississippi-belle-chasse
name: Mississippi River, Chalmette to Belle Chasse (Louisiana, USA)
river: Mississippi River
category: D
rationale:
  "Validation reach (category D). The lower Mississippi River from Chalmette to the USGS streamgage
  07374525 at Belle Chasse, which records continuous turbidity (parameter 63680, FNU). The main
  channel is about 770 m wide at the gauge (pilot selection). No dam lies on the lower Mississippi.
  The reach is chosen for its measurement, not for any pressure: no actor is the subject of any
  record."
