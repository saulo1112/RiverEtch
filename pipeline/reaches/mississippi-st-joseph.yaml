# Mississippi River, St. Joseph to river mile 378 (Louisiana and Mississippi, USA): the ungauged
# reach (preregistration-transfer.md, section 5), chosen by the owner on 2026-10-20 among three
# candidates as "Lower Mississippi at Natchez". No USGS turbidity gauge (63680) is on the river here.
# It lives outside pipeline/sites/ so the Colombian site screening never reads it.
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: mississippi-st-joseph
name: Mississippi River, St. Joseph to river mile 378 (Louisiana and Mississippi, USA)
river: Mississippi River
category: D
rationale:
  "Ungauged reach. The lower Mississippi River from the USGS location near St. Joseph, Louisiana,
  down to river mile 378, about 25 km above Natchez, Mississippi. No USGS turbidity series (63680)
  is on the river in the reach's box (USGS Water Data API, 2026-10-20); the only one in the box is
  Fields Lake near Church Hill, a lake, for four days in October 2012. The turbidity class comes
  from a model that never saw this reach, with the expected error of the transfer test. The reach
  is chosen for having no gauge, not for any pressure: no actor is the subject of any record."
