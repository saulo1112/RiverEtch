# Missouri River, Hermann to New Haven (Missouri, USA): v4's second demo reach (preregistration v4, A).
# A validation reach with a continuous, approved turbidity gauge at its upstream end (USGS 06934500).
# It lives outside pipeline/sites/ so the Colombian site screening never reads it.
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: missouri-hermann
name: Missouri River, Hermann to New Haven (Missouri, USA)
river: Missouri River
category: D
rationale:
  "Validation reach (category D). The Missouri River below the USGS streamgage 06934500 at Hermann,
  which records continuous turbidity (parameter 63680, FNU) since before 2017. The main channel is
  about 400 m wide at the gauge (pilot selection, docs/water-quality/inputs/usgs/sites.csv). No dam
  lies on the lower Missouri; the Gasconade River joins about 10 km upstream of the gauge, outside
  the reach. The reach is chosen for its measurement, not for any pressure: no actor is the subject of
  any record."
