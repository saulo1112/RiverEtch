# Platte River, Louisville to near its mouth (Nebraska, USA): a v5 demo reach (preregistration v5).
# The estimate station is the continuous, approved turbidity gauge at the upstream end (USGS 06805500).
# It lives outside pipeline/sites/ so the Colombian site screening never reads it.
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: platte-louisville
name: Platte River, Louisville to near Oreapolis (Nebraska, USA)
river: Platte River
category: D
rationale:
  "Validation reach (category D). The lower Platte River below the USGS streamgage 06805500 at
  Louisville, which records continuous turbidity (parameter 63680, FNU). The braided main channel is
  about 305 m wide at the gauge (pilot selection). The reach ends above the Missouri River
  confluence. It is chosen for its measurement, not for any pressure: no actor is the subject of any
  record."
center:
  lon: -96.0563
  lat: 41.03
  description: Midpoint of the two anchors (approximate reach center)
  basis: computed from the anchors; corrected against the water mask by the run
  source_url: ""
