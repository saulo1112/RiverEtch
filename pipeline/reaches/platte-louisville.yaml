  description: USGS 06805500, Platte River at Louisville, NE (the streamgage)
  basis: "Stated by source: the monitoring location's coordinates in the USGS Water Data API."
  source_url: https://waterdata.usgs.gov/monitoring-location/USGS-06805500/
downstream_anchor:
  lon: -95.955
  lat: 41.045
  description: The Platte River about 3 km west of Oreapolis, NE, above the Missouri confluence
  basis: "Estimated from Oreapolis, NE (OpenStreetMap Nominatim, 41.047 N 95.919 W), moved 3 km
    upstream so the anchor stays on the Platte; to be snapped to the water mask."
  source_url: https://nominatim.openstreetmap.org/search?q=Oreapolis%2C+Nebraska
