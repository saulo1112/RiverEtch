climate_note:
  "Quibdó's mean annual rainfall is about 8,050 mm. Hispanopedia gives 8,051.1 mm and calls
  it the rainiest South American city of more than 100,000 people. Climate-data.org gives roughly the
  same figure, classifies the climate as Köppen Af (equatorial, no true dry season) and says rain falls
  almost every day. The monthly figures come from a single summary: October is the wettest month (about
  871 mm), February the driest (about 333 mm), and May to November each exceed about 750 mm. MeteoWeb
  describes Chocó as one of the rainiest areas in the world. No source was found that quantifies cloudiness.
  Persistent cloud is expected from this rainfall regime, so the number of usable Sentinel-2 scenes from
  2022 to 2025 will be small. The relatively less rainy months (around January to March) are the likeliest
  clear windows. That last point is an inference, not a source statement."
