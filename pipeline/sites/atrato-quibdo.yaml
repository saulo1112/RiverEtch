# Río Atrato at Quibdó (Río Quito confluence reach)
# Category B. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: atrato-quibdo
name: Río Atrato at Quibdó (Río Quito confluence reach)
river: Río Atrato
category: B
rationale:
  "Mining benchmark. Río Atrato at Quibdó (Chocó), from about 8 km above to about 8 km below
  the town, across the Río Quito confluence 'in front of Quibdó'. Authorities and press report gold-dredge
  activity and mercury use on the Río Quito (Paimadó, Villa Conto) and dredge-destruction operations under
  Constitutional Court ruling T-622 of 2016, which recognised the Atrato as a subject of rights. The above-
  versus below-confluence contrast is the design. Quibdó receives about 8,000 mm of rain a year with no
  true dry season, so clear scenes are expected to be rare: an unobservable result here means 'not observable',
  not 'clean'."
