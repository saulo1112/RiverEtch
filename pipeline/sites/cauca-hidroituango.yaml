backwater_note:
  The reservoir is about 79 km long (one summary also says 78 km) and lies entirely upstream
  (south) of the dam, reaching up the canyon through Toledo, Sabanalarga, Peque, Liborina and Buriticá.
  The proposed reach starts below the dam and the powerhouse outlets, so it is outside the reservoir and
  its backwater. The AOI's SW corner includes the dam and possibly a little reservoir water just upstream
  of the dam axis; mask out water upstream of the dam. The planned Espíritu Santo project, 18-24 km downstream,
  would impound this reach if ever built, but it is not built (EPM is only studying reactivation), so
  no backwater exists in the reach for 2022-2025.
river_width_note:
  unknown. No search result gives a channel width for the Cauca between Hidroituango and
  Puerto Valdivia. Sources describe this stretch as a narrow, V-shaped canyon (about 38 km from the dam
  to Puerto Valdivia). The only nearby figure is the 135 m span of the old suspension bridge between Ituango
  and Briceño, now flooded inside the reservoir, which is not a width measurement. Mean flow is about
  1,010 m3/s, so the channel is probably above 50 m at normal flow, but it may approach the ~50 m Sentinel-2
  limit at low flow (e.g. Sep 2023, when the spillway was closed) and in tight canyon bends. Confirm with
  the water mask.
climate_note:
  "The Colombian Andes have a bimodal rainfall regime with rainy seasons in April-May and
  October-November (Crisis24; bimodal pattern for the Cauca basin at 4-7°N). Climate records show Ituango
  averaging about 630 mm with 27 rain days in May (weatherapi, single source). Annual totals for Briceño
  conflict between sources (6,528.7 mm in one, 1,254 mm in another). The UdeA describes the Cauca canyon
  grading from semi-desert near Santa Fe de Antioquia to rainy country at Valdivia, so this reach is at
  the wet end. Expect frequent cloud and few clear Sentinel-2 scenes. The idea that the clearest windows
  are likely Dec-Mar and Jun-Aug is my inference, not sourced. Hydrologic context: very low inflows in
  Sep 2023 (spillway closed) and the 11 Apr 2025 flood peak."
