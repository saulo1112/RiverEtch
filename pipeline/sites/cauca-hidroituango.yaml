# Río Cauca below Hidroituango: from the powerhouse discharge outlets and Río Ituango confluence to the planned Espíritu Santo dam site
# Category A. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: cauca-hidroituango
name:
  "Río Cauca below Hidroituango: from the powerhouse discharge outlets and Río Ituango confluence
  to the planned Espíritu Santo dam site"
river: Río Cauca
category: A
rationale:
  "Río Cauca below Hidroituango (Ituango/Briceño, Antioquia), from just below the powerhouse
  discharge outlets and the Río Ituango confluence toward the planned Espíritu Santo site, about 20 km
  through the Cauca canyon. Public sources date changes of operating regime in the study window (first
  generation in November 2022, units 3 and 4 in commercial operation at the end of October 2023); stage-2
  baselines are split at those dates. No source states the canyon channel width; the water mask decides.
  Hypothesis under test: reservoir operations give discrete, datable turbidity changes."
