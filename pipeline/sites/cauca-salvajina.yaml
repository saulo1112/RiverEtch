# Río Cauca below Salvajina dam (Río Ovejas confluence to La Balsa)
# Category A. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: cauca-salvajina
name: Río Cauca below Salvajina dam (Río Ovejas confluence to La Balsa)
river: Río Cauca
category: A
rationale:
  "Río Cauca below the Salvajina dam (Suárez, Cauca). Public sources describe a multipurpose
  reservoir (flood control, dilution, energy) whose daily discharges are programmed jointly by the operator
  and CVC. The reach runs from the Río Ovejas confluence, about 3.5 km below the dam, to the Cauca-La
  Balsa gauging station, about 27 km below it. Sources describe a braided or intermediate channel about
  75-90 m wide at bankfull, close to the width limit for 10 m pixels at low releases. Public sources also
  report gold mining in the Ovejas basin, a possible non-dam sediment input at the upstream end. Hypothesis
  under test: reservoir operations give discrete, datable turbidity changes."
