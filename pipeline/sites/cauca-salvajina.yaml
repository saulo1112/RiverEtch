operator:
  Celsia Colombia, through its subsidiary EPSA, per public sources; daily discharges are programmed
  jointly with CVC in the Salvajina operation committee.
regulator:
  CVC (Valle del Cauca) co-programs the discharges; CRC is the environmental authority in Cauca
  department. No source confirmed ANLA's role for Salvajina.
backwater_note:
  The Salvajina reservoir (about 31 km long, total volume about 765-909 Mm3 depending on
  the source, operating levels about 1105-1155 m a.s.l.) lies entirely upstream (south) of the dam, toward
  Morales municipality. RCN reports describe the reservoir rising to affect the El Embarcadero / Santa
  Bárbara area of Morales. The study reach starts about 3.5 km below the dam in tailwater at about 1000
  m elevation, below the reservoir's minimum operating level of 1105 m. It is therefore outside the reservoir
  and its backwater. The AOI includes the dam toe only so the dam-only segment past Suárez can be checked.
river_width_note:
  About 75-90 m at bankfull in the Salvajina-La Balsa sector. The CVC-Univalle executive
  report gives 75-90 m, and the Ingeniería y Competitividad characterization gives about 80 m at bankfull.
  For comparison, La Balsa-Juanchito averages about 100 m at bankfull. The reach is above the ~50 m Sentinel-2
  threshold, but the channel is braided or intermediate with bars. At dry-season releases of about 50-60
  m3/s, the continuous wetted width may be noticeably narrower and close to the limit. The first ~17 km
  below the dam lie in a confined valley (Alvarado et al. 2023).
climate_note:
  "The upper Cauca has a bimodal rainfall regime. One source gives rainy seasons in March-May
  and September-November, with less rain in December-February and June-August, linked to the ITCZ. A CVC-derived
  summary gives rainy periods of April-June and October-December and dry periods of January-March and
  July-September. Salvajina stores water until about June and releases it from July to support dry-season
  flows. One source classifies Suárez's climate as Af. No source on cloud frequency was found. In an
  Andean valley, cloud is likely frequent, so the drier windows (Dec-Feb, Jul-Sep) are probably the best
  for clear Sentinel-2 scenes. ENSO matters: in El Niño dry seasons releases have been about 53 m3/s (undated
  El País report), and November 2022 (La Niña) brought high releases and bankfull flow at La Balsa."
