# Río Magdalena below the El Quimbo–Betania dam cascade (Hobo/Yaguará to above the Río Neiva confluence), Huila
# Category A. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: magdalena-betania
name:
  Río Magdalena below the El Quimbo–Betania dam cascade (Hobo/Yaguará to above the Río Neiva confluence),
  Huila
river: Río Magdalena
category: A
rationale:
  Río Magdalena below the El Quimbo-Betania cascade (Huila). Public sources say El Quimbo releases
  into the Betania reservoir, so the first free-flowing water below both dams starts at the Betania outlet
  (Hobo/Yaguará); the reach runs about 20 km downstream and ends just above the Río Neiva confluence.
  Flow reflects the combined operation of both plants; public sources date spillway-gate operations in
  October 2022 and April-July 2025. Optional third dam kept alongside Urrá; the screening decides which,
  if either, is observable.
