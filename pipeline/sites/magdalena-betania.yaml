operator: Enel Colombia (formerly Emgesa) operates both El Quimbo and Betania, per public sources.
regulator:
  ANLA follows El Quimbo's environmental licence, per public sources; no source found naming
  the licensing authority for Betania.
backwater_note:
  El Quimbo's reservoir is about 55 km long at its normal maximum level (720 m a.s.l.).
  El Quimbo's outflow and the Río Páez (about 1.3 km below the El Quimbo dam) both enter the tail of the
  Betania reservoir, so the Magdalena between the two dams is effectively reservoir or backwater, and
  no free-flowing reach exists immediately below El Quimbo. The Betania reservoir ends at the Betania
  dam (Hobo/Yaguará, 2.7082 N, -75.4298 W). The study reach starts below this dam, so it lies entirely
  outside both reservoirs and their backwater. Downstream municipalities named during gate operations
  are Hobo, Campoalegre, Rivera, Yaguará, Palermo, Aipe, Villavieja and Neiva.
river_width_note:
  unknown. No search result stated a width for the Magdalena below Betania. Discharges
  reported for the reach (about 975 m3/s expected on 2025-04-30; about 2,000 m3/s released on 2025-07-15)
  suggest the channel is well over 50 m, but this is an inference. Confirm with the Sentinel-2 water mask,
  especially at low-release periods (low-dispatch days, 2024 dry season).
climate_note:
  No source found that describes climate or cloudiness for this reach. The sources describe
  high-inflow rainy episodes in mid-October 2022, late April 2025, and a persistent rainy period (ola
  invernal) in June-July 2025, so expect cloud-limited Sentinel-2 coverage around those dates. Cloud frequency
  is unsourced and should be measured from the scene catalogue (scene cloud cover).
