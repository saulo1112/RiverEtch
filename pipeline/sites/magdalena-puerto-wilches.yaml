climate_note:
  "No source found states the rainy seasons or cloudiness for this reach explicitly. Dated
  hydrology reports from sources:

  - El Heraldo, early 2024 (El Niño): Cormagdalena data showed the lowest river level in Barrancabermeja,
  about 36 cm (minimum in that area 12 cm).

  - Puerto Wilches flood and high-water alerts: floods affecting 454 families (Infobae, 2022-04-10); 'SOS'
  river-risk alert (Vanguardia, 2024-05-16); 30,000 people at flood risk (Vanguardia, 2025-03-31); red
  alert for rising river (Vanguardia, 2025-05-08).

  - Barrancabermeja rain alert continuing through March 2026 (Vanguardia, 2026-02-26).


  The reports cluster high water in March–May. The usual bimodal regime for the Magdalena Medio (Apr–May
  and Sep–Nov wet seasons, with persistent cloud) comes from general knowledge, not from a source found
  here."
