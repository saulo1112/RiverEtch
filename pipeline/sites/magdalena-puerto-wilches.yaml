operator:
  Cormagdalena contracts the maintenance dredging; the contractor named for the 2024-2026 Barrancabermeja-Pinillos/Barranquilla
  contract is Consorcio PanMar-Vías 2023 (Vanguardia, Portafolio). Cormagdalena also operates its own
  dredges.
