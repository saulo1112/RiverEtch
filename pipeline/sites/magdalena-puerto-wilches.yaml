id: magdalena-puerto-wilches
name: Río Magdalena, Puerto Wilches to San Pablo (Cantagallo navigation crossing)
river: Río Magdalena
category: C
rationale:
  "Dredging reach (category C). Río Magdalena from Puerto Wilches (Santander) to San Pablo (Bolívar),
  inside the Barrancabermeja-Pinillos sector where Cormagdalena contracted maintenance dredging of the
  navigation channel for 2024-01-01 to 2026-07-31 (Vanguardia, Portafolio). The reach contains the 'Canta
  Gallo' critical point named in an undated dredging campaign, and a Cormagdalena dredge worked the Sitio
  Nuevo sector of Puerto Wilches in early 2023. In the study window the evidence that dredging happened
  inside this reach is contract-level only: no source found names the crossings dredged in 2024-2025 or
  their dates. The Río Sogamoso, regulated upstream by the Hidrosogamoso dam, joins above the reach. The
  channel is wide and carries islands and bars."
