operator:
  No major pressure identified in the AOI. ANI contracted structuring studies for Meta navigability
  (Unión Temporal EIF Navegabilidad Río Meta); no dredging works were found for 2022-2025.
regulator:
  Corporinoquia for the Casanare bank (not confirmed by a search result in this run); the opposite-bank
  authority is unverified.
backwater_note: ""
river_width_note:
  "≥400 m: a historical description says the Meta between Maquivor and the mouth of the
  Cravo is no less than 400 m wide, and 1,000-1,600 m where islands split the channel (one source, sogeocol
  'El río Meta'; not a modern measurement; Maquivor's position relative to Orocué not verified). Confirm
  with the water mask."
climate_note:
  Orocué has a tropical savanna climate (Köppen Aw), with moderate to little rainfall from
  December to March and heavy rainfall from April to November (Wikipedia Orocué article, one summary).
  December-March is the best window for clear Sentinel-2 scenes. The Colombian Air Force meteorological
  service issued a sudden-river-rise alert (No. 099) in July 2025 that a summary associates with high
  Meta River levels.
