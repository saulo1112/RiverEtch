# Río Meta below Orocué (control reach)
# Category D. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: meta-orocue
name: Río Meta below Orocué (control reach)
river: Río Meta
category: D
rationale:
  "Control (category D). Río Meta just below Orocué (Casanare), a wide savanna river (at least
  400 m, more where islands split it, per a historical description) with a December-March dry season.
  Searches for mining, dredging and large urban or industrial discharge in this reach found none: the
  Meta navigability project reached only the study stage (ANI, products due December 2024), the oil-related
  spills found are in the upper basin, and mining results named other rivers. The large reservoirs found
  in the basin (Chivor, Guavio) are in the Andean departments, far upstream. Orocué itself is a small
  river port at the upstream end. 'No identified major pressure' means none was found in these searches,
  not that none exists."
