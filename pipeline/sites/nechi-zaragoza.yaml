operator:
  Mineros Aluvial S.A.S BIC is named by ANLA as holder of the licensed dredging project 'Explotación
  aurífera en la cuenca del río Nechí' (Resolution 810 of 3 Sep 2001); press and police also report dredges
  operated by others on the river. Reports of activity only.
regulator:
  CORANTIOQUIA (Panzenú territorial office), the regional environmental authority named by ANLA;
  ANLA follows the licensed project.
backwater_note: ""
river_width_note:
  unknown. No source states the channel width. Mineros' 'widths up to 3.5 km' refers to
  the alluvial deposit and floodplain, not the channel. Wikipedia gives a mean discharge of 830 m3/s at
  Nechí town, which is consistent with a channel over 100 m wide, but that is an inference, not a measurement.
climate_note:
  Bajo Cauca has two rainy seasons, March-May and September-November (to December), with the
  second one the wettest of the year. Rainfall is lower in December-February and dips mid-year (June-August).
  This is driven by the trade winds and the migration of the ITCZ. Only one search summary supports this,
  and it draws on Antioquia early-warning bulletins and a Ramsar document. No source on cloudiness was
  found. Floods of the Nechí and Tigüí at El Bagre are reported in the press.
