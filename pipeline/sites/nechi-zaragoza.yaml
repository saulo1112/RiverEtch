# Río Nechí, Zaragoza to El Bagre (Bajo Cauca, Antioquia)
# Category B. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: nechi-zaragoza
name: Río Nechí, Zaragoza to El Bagre (Bajo Cauca, Antioquia)
river: Río Nechí
category: B
rationale:
  "Mining benchmark. Río Nechí from Zaragoza to El Bagre (Bajo Cauca, Antioquia), upstream of
  its mouth on the Cauca, so the reach does not carry the Hidroituango-regulated Cauca flow. ANLA lists
  a licensed alluvial gold-dredging project on the Nechí floodplain in El Bagre, Zaragoza, Caucasia and
  Nechí (in operation, Resolution 810 of 2001), placed between El Bagre and the San Pedro creek, i.e.
  mostly downstream of this reach; the operator reports dredging along more than 50 km of the river. Press
  and police report further dredge activity on the river between El Bagre and Nechí. Dredge ponds and
  pits on the floodplain may join the water mask; the sub-reaches stay on the main channel. The Río Porce,
  regulated by hydropower dams upstream, joins the Nechí near or above Zaragoza (position not verified):
  a possible flow confounder."
