# Río Sinú below Urrá I dam (Tierralta, Córdoba)
# Category A. Generated from the site research of 2026-10-07 (WebSearch summaries only; see docs/site-screening/report.md).
# Every position is approximate; the run snaps anchors to the SCL water mask and reports the shift.
id: sinu-urra
name: Río Sinú below Urrá I dam (Tierralta, Córdoba)
river: Río Sinú
category: A
rationale:
  Río Sinú below the Urrá I dam (Tierralta, Córdoba), about 22 km from the discharge outlet downstream
  toward the Carrizola sampling station. Public sources describe a free-overflow spillway (crest about
  130.5 m a.s.l.) and date discharge increases, overflow episodes and operational alerts in 2022 and 2025.
  No source states the width at the reach (about 160 m is reported at Montería, about 100 km downstream).
  Optional third dam; kept because it has dated events in the window.
