backwater_note:
  The reach lies entirely downstream of the dam, so neither the reservoir nor its backwater
  can reach it. The Urrá I reservoir (about 7,400 ha per one summary; free-overflow spillway crest at
  130.5 masl) lies upstream, south and southwest of the dam. It is fed mainly by the Sinú and Verde rivers,
  and Puerto Frasquillo is a port on its shore about 45 minutes by road from Tierralta. No source found
  says where the backwater tail ends on the Sinú and Verde arms. That does not matter for a below-dam
  reach. The south edge of the AOI (7.99) takes in a little reservoir water next to the dam, which should
  be masked out. No other dam lies downstream on the Sinú.
river_width_note:
  Unknown at the reach. One search summary (expreso.ec) gives an average width of about
  160 m for the Sinú at Montería, roughly 100 km further downstream. MDPI Applied Sciences 13(12):7109
  (2023) reports that channel width below Urrá I grew by about 17% on average after the dam, but the summary
  gave no absolute values. Turbine releases of several hundred m3/s (486.3 m3/s on 2022-11-28) and mid-channel
  islands below the outlet (UNAL) suggest the water is wider than 50 m. That is an inference, not a measurement.
  The Angostura de Urrá narrows right below the dam may be narrower than 50 m; check this with the water
  mask.
climate_note:
  "Sources give only partial climate information. El Heraldo (31 Jul 2025) says the rainy
  season runs through November. The migratory-fish study collected ichthyoplankton through the April-October
  high-water reproductive season. Infobae (Jul 2025) reports that 2025 was unusually wet: inflows were
  above the historical average from January and there were 26 floods with daily inflows above 700 m3/s.
  Rain linked to La Niña drove the November 2022 high flows. No source found quantifies cloudiness. The
  idea that December-March is the drier period with clearer Sentinel-2 scenes is an inference that needs
  checking against scene cloud statistics."
