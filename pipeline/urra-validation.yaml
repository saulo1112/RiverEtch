# Urrá validation settings. Pre-registered in docs/urra-validation/method.md, before any NDTI of
# the validation was computed: change a value here only together with the method and list it under
# its Deviations, never to tune results after seeing them. Paths are relative to the repository root.

screening_config: pipeline/screening.yaml # pixel guards, geometry and the point rain rule
method: docs/urra-validation/method.md

sites:
  target: sinu-urra
  control: meta-orocue # its MNDWI mask needs the screening's post-hoc mask rule
  reference: magdalena-puerto-wilches # quiet reference, report-only, never in the criteria

mask_variant: post-hoc # SCL mask, MNDWI where SCL fails: reproduces the screening's geometry

period: # scenes analysed
  start: 2018-12-01
  end: 2025-12-31
geometry_period: # the only scenes the water masks are built from (the screening's period)
  start: 2022-01-01
  end: 2025-12-31
holdout: # never looked at before this pre-registration; report-only view
  start: 2018-12-01
  end: 2021-12-31

# Season of the baselines, frozen to the screening's rainy months (2022-2025, Open-Meteo at the
# reach center). The rule applied to the whole period is reported, never used.
rainy_months:
  sinu-urra: [4, 5, 6, 7, 8, 9]
  meta-orocue: [4, 5, 6, 7, 8, 11]
  magdalena-puerto-wilches: [4, 5, 6, 8, 10, 11]

screening_reference:
  results: docs/site-screening/results-posthoc
  evidence_sha256: # SHA-256 of the 2022-2025 STAC item ids in the screening's run manifest
    sinu-urra: 678e6ef88318765151ded43c20a07c2148c36572891dcc97cbf10804ce5add9b
    meta-orocue: 1654814304a26199bc25e794d56610d8bc48c1ed25deb366d28c207018de170d
    magdalena-puerto-wilches: 8bff3e8c7dce939d08aa62d0c62a1f0d4289360d02fda1d31895a9e18887be31
  events_sha256: eef554292bca112f858ff206a533d0334ac7fa7449646174be9780fa79fb5cf8
  ndti_decimals: 4

# Ten assumption variants: D0 is the screening rule; each other variant changes one thing.
# "distinct" marks the variants that truly differ from D0 (report-only persistence).
variants:
  - id: D0
    description: screening rule (season group of >= 8, else all of >= 12; |z| >= 3; pixel B11 <= 0.05)
    baseline: season-then-all
    distinct: false
  - id: B1
    description: season group only (>= 8), no fallback
    baseline: season
    distinct: false
  - id: B2
    description: calendar month +-1 pooled over the years (>= 8), no fallback
    baseline: month-window
    month_halfwidth: 1
    window_min: 8
    distinct: true
  - id: B3
    description: centred 365-day window (+-182 days, >= 6), no fallback
    baseline: day-window
    day_halfwidth: 182
    window_min: 6
    distinct: true
  - id: B4
    description: smaller group minimums (season >= 5, else all >= 8)
    baseline: season-then-all
    season_min: 5
    all_min: 8
    distinct: false
  - id: B5
    description: larger group minimums (season >= 12, else all >= 20)
    baseline: season-then-all
    season_min: 12
    all_min: 20
    distinct: false
  - id: Z2.5
    description: anomaly threshold |z| >= 2.5
    baseline: season-then-all
    anomaly_z: 2.5
    distinct: false
  - id: Z3.5
    description: anomaly threshold |z| >= 3.5
    baseline: season-then-all
    anomaly_z: 3.5
    distinct: true
  - id: G1
    description: stricter pixel glint limit (B11 <= 0.03)
    baseline: season-then-all
    swir16_max: 0.03
    distinct: true
  - id: G2
    description: drop scenes whose glint share exceeds 0.5 in either sub-reach
    baseline: season-then-all
    max_glint_share: 0.5
    distinct: true

criteria:
  persistence_min: 8 # flagged in >= 8 of the 10 variants (excluded or insufficient count against)
  episode_gap_days: 30 # anomalous scenes <= 30 days apart are one episode
  min_episodes: 4 # N, the user's choice
  share_ratio_min: 3.0 # target D0 anomalous-scene share >= 3 x the control's
  zero_share_numerator: 0.5 # a control share of 0 counts as 0.5 / n

rain:
  unknown_is_coincident: true
  catchment:
    hydrobasins_url: https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_sa_lev12_v1c.zip
    hydrobasins_layer: hybas_sa_lev12_v1c
    anchor_tolerance_deg: 0.01 # outlet: basins containing the downstream anchor +- 0.01 deg
    spacings_deg: [0.30, 0.25, 0.20, 0.15, 0.125, 0.10] # coarsest giving 6-12 points
    points_min: 6
    points_max: 12
    windows_h: [24, 72, 168]
    statistics: [mean, max] # over the grid points
    percentile: 90 # of the daily values of each statistic over the period
    sample_hour_utc: 15 # the daily values are sums ending at 15:00 UTC
    grid_csv: docs/urra-validation/rain-grid.csv
    request_pause_s: 2.0 # between Open-Meteo requests
    max_attempts: 6 # per request, with growing waits after HTTP 429 or errors

chirps: # probed and compared, never used in the criteria
  cog_url_template: https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/cogs/p05/{year}/chirps-v2.0.{date}.cog
  probe_date: 2024-01-16
  days_before: 3

placebo:
  shuffles: 1000
  seed: 20261007

seasonality_halfwidth_days: 15

events: # report-only; the catalog is frozen by the hash above
  catalog: docs/site-screening/events.csv
  window_before_days: 2
  window_after_days: 10
  scored_precisions: [day, week]
  chance_windows: 500
  seed: 20260101

outputs:
  results: docs/urra-validation/results
  case_json: pipeline/out/case/urra.json
  case_sample: docs/urra-validation/urra.sample.json
  max_committed_bytes: 300000 # figures and the case sample
